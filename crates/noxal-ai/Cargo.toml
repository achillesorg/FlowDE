[package]
name = "noxal-ai"
description = "NoxalAi: local Qwen-based assistant service (runtime abstraction, gating, private conversations, safe tool layer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "noxal-ai"
path = "src/main.rs"

[dependencies]
flow-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
zbus.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand"] }
password-hash = { version = "0.5", default-features = false, features = ["getrandom"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
