[package]
name = "kiln-lock"
description = "Lock state machine, argon2id passcode storage, biometric hook, auto-lock timers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kiln-lock"
path = "src/main.rs"

[dependencies]
flow-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand"] }
password-hash = { version = "0.5", default-features = false, features = ["getrandom"] }
