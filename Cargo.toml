[workspace]
resolver = "2"
members = ["crates/flow-common", "crates/flow-settings", "crates/kiln-notifs", "crates/flow-apps", "crates/kiln-lock", "crates/flow-theme", "crates/flow-power", "crates/flow-sensors", "crates/flow-haptics", "crates/flow-net", "crates/flow-clock", "crates/flow-calendar", "crates/flow-camera", "crates/kiln-desktop-mode", "crates/flow-store", "crates/flow-media", "crates/flow-dlp", "crates/kiln-wall", "crates/kiln-dm", "crates/noxal-ai", "crates/flow-session", "crates/flow-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/achillesorg/FlowDE"
rust-version = "1.75"

[workspace.dependencies]
flow-common = { path = "crates/flow-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros", "signal", "process", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
